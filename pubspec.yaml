name: smart_hospital_queue_flutter
description: Smart Hospital Appointment & Queue Management - Cross Platform Flutter App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.6.1

  # Navigation
  go_router: ^14.6.3

  # Firebase (optional - app works without it)
  firebase_core: ^3.15.2
  firebase_auth: ^5.7.0
  cloud_firestore: ^5.6.0
  firebase_messaging: ^15.2.4

  # Local Storage
  shared_preferences: ^2.3.4
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # HTTP
  dio: ^5.8.0

  # QR
  qr_flutter: ^4.1.0

  # Utilities
  intl: ^0.20.2
  uuid: ^4.5.1
  connectivity_plus: ^6.1.4
  rxdart: ^0.28.0

  # Notifications
  flutter_local_notifications: ^18.0.1

  # Charts
  fl_chart: ^0.70.2

  # UI
  cupertino_icons: ^1.0.8
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  lottie: ^3.3.1
  flutter_animate: ^4.5.0
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.15
  image_picker: ^1.1.2
  percent_indicator: ^4.2.3
  badges: ^3.1.2
  timeline_tile: ^2.0.0
  table_calendar: ^3.1.3
  pin_code_fields: ^8.0.1
  country_code_picker: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/
